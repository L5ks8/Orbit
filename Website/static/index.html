  <!-- App Bootstrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Auto-resize textareas dynamically
      document.addEventListener('input', (e) => {
        if (e.target.tagName === 'TEXTAREA' && e.target.id !== 'ai-helper-textarea' && !e.target.hasAttribute('data-no-autoresize')) {
          e.target.style.height = 'auto';
          e.target.style.height = e.target.scrollHeight + 'px';
        }
      });

      // Start Router
      Router.init();

      // Peak Bot Smooth Inertial Scroll Delay (Lenis)
      if (typeof Lenis !== 'undefined') {
        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true,
          touchMultiplier: 1.2,
          prevent: (node) => {
            if (window.__orbitDropdownOpen) return true;
            if (!node || !node.closest) return false;
            if (node.closest('#dash-sidebar, [data-lenis-prevent], .custom-select-menu, .orbit-dropdown-menu, [id$="-menu"], [id$="-dropdown"], [id$="-popover"]')) {
              return true;
            }
            let el = node;
            while (el && el !== document.body && el !== document.documentElement) {
              const style = window.getComputedStyle(el);
              if ((style.overflowY === 'auto' || style.overflowY === 'scroll') && el.scrollHeight > el.clientHeight) {
                return true;
              }
              el = el.parentElement;
            }
            return false;
          }
        });
        window.__lenis = lenis;

        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // Smooth glide on navbar/footer anchor clicks
        document.addEventListener('click', (e) => {
          const anchor = e.target.closest('a[href^="#"]');
          if (anchor) {
            const hash = anchor.getAttribute('href');
            if (hash && hash.length > 1) {
              const target = document.querySelector(hash);
              if (target) {
                e.preventDefault();
                lenis.scrollTo(target, { offset: -90 });
              }
            }
          }
        });
      }
    });
  </script>
