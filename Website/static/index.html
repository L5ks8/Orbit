<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/img/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Der All-in-One KI Discord Bot für Server-Setup & Management</title>
  <meta name="title" content="Orbit — Der All-in-One KI Discord Bot" />
  <meta name="description" content="Beschreiben Sie Ihre Community und Orbit baut den gesamten Discord-Server: Kanäle, Rollen, Berechtigungen und Automatisierung. 30+ Funktionen, kostenlos." />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- OpenGraph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/" />
  <meta property="og:title" content="Orbit — Der All-in-One KI Discord Bot" />
  <meta property="og:description" content="Beschreiben Sie Ihre Community und Orbit baut den gesamten Discord-Server: Kanäle, Rollen, Berechtigungen und Automatisierung. 30+ Funktionen, kostenlos." />
  <meta property="og:image" content="/img/preview.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="/" />
  <meta property="twitter:title" content="Orbit — Der All-in-One KI Discord Bot" />
  <meta property="twitter:description" content="Beschreiben Sie Ihre Community und Orbit baut den gesamten Discord-Server: Kanäle, Rollen, Berechtigungen und Automatisierung. 30+ Funktionen, kostenlos." />
  <meta property="twitter:image" content="/img/preview.png" />

  <!-- Schema.org JSON-LD structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Orbit – Free AI Discord Bot That Builds & Manages Your Server",
    "description": "Describe your community in plain German or English and Orbit builds the whole Discord server: channels, roles, permissions and automation. 30+ features, free.",
    "url": "/"
  }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="/css/orbit.css" />
  <link rel="stylesheet" href="/css/orbit-extra.css" />
</head>
<body class="antialiased bg-neutral-950 text-neutral-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500/30 selection:text-white">

  <!-- Experiments tracker -->
  <script>window.__PB_EXPERIMENTS__ = [];</script>

  <!-- Floating Pill Navbar -->
  <nav id="main-navbar" style="top:var(--promo-h, 0px); transition-property:top; transition-duration:450ms; transition-timing-function:cubic-bezier(0.22, 1, 0.36, 1)" class="fixed left-0 right-0 z-50">
    <div class="mx-auto mt-6 w-[min(1180px,calc(100%-24px))]">
      <div class="relative flex items-center justify-between h-16 px-5 md:px-6 rounded-full border border-neutral-700/60 bg-neutral-900 transition-shadow duration-300 shadow-[0_2px_8px_rgba(0,0,0,0.25),0_6px_20px_rgba(0,0,0,0.25)]">
        
        <!-- Logo -->
        <a href="/" class="flex items-center gap-3">
          <img src="/img/logo.png" alt="Orbit" width="32" height="32" class="rounded-xl">
          <span class="text-lg font-semibold text-white">Orbit</span>
        </a>

        <!-- Center Nav Links -->
        <div class="hidden md:flex items-center gap-1 absolute left-1/2 -translate-x-1/2">
          <a href="/#features" class="px-5 py-2.5 rounded-full text-sm text-neutral-400 hover:text-white hover:bg-white/[0.06] transition-colors">Merkmale</a>
          <a href="/#templates" class="px-5 py-2.5 rounded-full text-sm text-neutral-400 hover:text-white hover:bg-white/[0.06] transition-colors">Vorlagen</a>
          <a href="/#pricing" class="px-5 py-2.5 rounded-full text-sm text-neutral-400 hover:text-white hover:bg-white/[0.06] transition-colors">Preise</a>
          <a href="/docs" class="px-5 py-2.5 rounded-full text-sm text-neutral-400 hover:text-white hover:bg-white/[0.06] transition-colors">Wiki</a>
        </div>

        <!-- Right Side: Discord Auth / User Slot -->
        <div class="hidden md:flex items-center gap-3" id="nav-user-slot">
          <button onclick="API.login(window.location.pathname).then(() => Router.checkAuth().then(() => Router.handleRoute()))" class="flex items-center gap-2 pl-4 pr-5 py-2 rounded-full text-xs font-semibold tracking-[0.3px] text-white bg-[#5865F2] shadow-[0_0_22.5px_rgba(88,101,242,0.3),0_0_45px_rgba(88,101,242,0.12),inset_0_0_0_1px_rgba(255,255,255,0.35)] hover:bg-[#4752c4] transition-all active:scale-[0.96] cursor-pointer">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 0 0-4.8851-1.5152.0741.0741 0 0 0-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 0 0-.0785-.037 19.7363 19.7363 0 0 0-4.8852 1.515.0699.0699 0 0 0-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 0 0 .0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 0 0 .0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 0 0-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 0 1-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 0 1 .0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 0 1 .0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 0 1-.0066.1276 12.2986 12.2986 0 0 1-1.873.8914.0766.0766 0 0 0-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 0 0 .0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 0 0 .0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 0 0-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"></path></svg>
            Melden Sie sich mit Discord an
          </button>
        </div>

        <!-- Mobile hamburger -->
        <button class="md:hidden text-white p-2" aria-label="Menü öffnen" onclick="document.getElementById('mobile-nav-drawer')?.classList.toggle('hidden')">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>
        </button>

      </div>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobile-nav-drawer" class="hidden md:hidden mx-auto mt-2 w-[min(1180px,calc(100%-24px))] p-4 rounded-2xl bg-neutral-900 border border-neutral-800 flex flex-col gap-2 shadow-2xl">
      <a href="/#features" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="px-4 py-2.5 rounded-xl text-neutral-300 hover:bg-neutral-800 text-sm font-medium">Merkmale</a>
      <a href="/#templates" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="px-4 py-2.5 rounded-xl text-neutral-300 hover:bg-neutral-800 text-sm font-medium">Vorlagen</a>
      <a href="/#pricing" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="px-4 py-2.5 rounded-xl text-neutral-300 hover:bg-neutral-800 text-sm font-medium">Preise</a>
      <a href="/docs" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="px-4 py-2.5 rounded-xl text-neutral-300 hover:bg-neutral-800 text-sm font-medium">Wiki / Dokumentation</a>
    </div>
  </nav>

  <!-- Dynamic Application Root -->
  <main id="app" class="flex-1 w-full"></main>

  <!-- Container for Toast Notifications & Modals -->
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-container"></div>

  <!-- Global Namespaces Initialization -->
  <script>
    window.Pages = {};
    window.DashboardTabs = {};
  </script>

  <!-- Core Scripts -->
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>

  <!-- Dashboard Tab Modules -->
  <script src="/js/dashboard/overview.js"></script>
  <script src="/js/dashboard/modules.js"></script>
  <script src="/js/dashboard/verification.js"></script>
  <script src="/js/dashboard/embed-builder.js"></script>
  <script src="/js/dashboard/extra-tabs.js"></script>

  <!-- Page Modules -->
  <script src="/js/pages/landing.js"></script>
  <script src="/js/pages/server-selector.js"></script>
  <script src="/js/pages/appeal.js"></script>
  <script src="/js/pages/verify.js"></script>
  <script src="/js/pages/public-pages.js"></script>
  <script src="/js/pages/dashboard.js"></script>

  <!-- Client-Side SPA Router -->
  <script src="/js/router.js"></script>

  <!-- App Bootstrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Auto-resize textareas dynamically
      document.addEventListener('input', (e) => {
        if (e.target.tagName === 'TEXTAREA') {
          e.target.style.height = 'auto';
          e.target.style.height = e.target.scrollHeight + 'px';
        }
      });

      // Start Router
      Router.init();
    });
  </script>
</body>
</html>
