<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Verification | Orbit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f1115;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1a1d24;
            border: 1px solid #2e333d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        p {
            color: #a0a6b1;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .captcha-box {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2e333d;
        }
        img {
            max-width: 100%;
            border-radius: 4px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #2e333d;
            background: #0f1115;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
        }
        input:focus {
            outline: none;
            border-color: #5865F2;
        }
        button {
            width: 100%;
            background: #5865F2;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #4752c4;
        }
        button:disabled {
            background: #3a404d;
            cursor: not-allowed;
        }
        .error {
            color: #ed4245;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
        .success {
            color: #57f287;
            font-size: 16px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="verify-container">
    <h1>Security Check</h1>
    <p>Please enter the characters from the image to verify your humanity and gain access to the server.</p>
    
    <div class="captcha-box">
        <img id="captcha-img" src="" alt="CAPTCHA Image">
    </div>
    
    <div class="error" id="error-msg">Incorrect CAPTCHA code. Please try again.</div>
    <div class="success" id="success-msg">Verification successful! You can now close this tab.</div>
    
    <input type="text" id="code-input" placeholder="Enter CAPTCHA code" maxlength="5">
    <button id="submit-btn" onclick="submitCaptcha()">Verify</button>
</div>

<script>
    const token = window.location.pathname.split('/').pop();
    document.getElementById('captcha-img').src = `/api/captcha/${token}`;

    async function submitCaptcha() {
        const code = document.getElementById('code-input').value;
        if (!code || code.length < 5) return;
        
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = "Verifying...";
        document.getElementById('error-msg').style.display = 'none';

        try {
            const res = await fetch(`/api/verify/${token}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });

            const data = await res.json();
            if (res.ok && data.success) {
                document.getElementById('success-msg').style.display = 'block';
                document.getElementById('code-input').style.display = 'none';
                document.getElementById('submit-btn').style.display = 'none';
                document.querySelector('.captcha-box').style.display = 'none';
                document.querySelector('p').style.display = 'none';
            } else {
                throw new Error(data.error || 'Failed to verify');
            }
        } catch (e) {
            document.getElementById('error-msg').innerText = e.message;
            document.getElementById('error-msg').style.display = 'block';
            btn.disabled = false;
            btn.innerText = "Verify";
            // Refresh captcha
            document.getElementById('captcha-img').src = `/api/captcha/${token}?t=${Date.now()}`;
            document.getElementById('code-input').value = '';
        }
    }

    document.getElementById('code-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            submitCaptcha();
        }
    });
</script>

</body>
</html>
