<div id="section-joinroles" class="dash-panel">
                        <div class="toggle-container" style="margin-bottom: 20px;">
                            <div>
                                <h3>Auto-Rolle</h3>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="autoroles_enabled">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="config-card">
                            <div style="margin-bottom: 20px;">
                                <h4 style="font-size: 16px; margin: 0 0 5px 0;">Rollen beim Beitritt</h4>
                            </div>

                            <div class="form-group" style="margin-bottom: 20px;">
                                <label style="font-size: 14px; font-weight: 600;">Rollen</label>
                                <span
                                    style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Rollen,
                                    die neue Mitglieder erhalten.</span>
                                <select id="autoroles_user" multiple></select>
                            </div>

                            <div class="form-group" style="margin-bottom: 0;">
                                <label style="font-size: 14px; font-weight: 600;">Bot Rollen</label>
                                <span
                                    style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Rollen,
                                    die neue Bots erhalten.</span>
                                <select id="autoroles_bot" multiple></select>
                            </div>
                        </div>
                    </div>
