<style>
.stat-card {
    flex: 1; min-width: 200px; background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}
.stat-card:hover {
    transform: translateY(-4px);
    border-color: rgba(74, 172, 189, 0.5);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), 0 0 12px rgba(74, 172, 189, 0.1);
}
.stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #4AACBD, transparent);
    opacity: 0;
    transition: opacity 0.3s;
}
.stat-card:hover::before {
    opacity: 1;
}
.stat-icon-wrapper {
    width: 36px; height: 36px; border-radius: 8px; 
    background: rgba(74, 172, 189, 0.15); 
    border: 1px solid rgba(74, 172, 189, 0.3); 
    display: flex; align-items: center; justify-content: center; 
    color: #4AACBD;
    box-shadow: 0 0 10px rgba(74, 172, 189, 0.1);
}
.chart-card {
    flex: 1; min-width: 300px; background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px;
    transition: border-color 0.3s;
}
.chart-card:hover {
    border-color: rgba(74, 172, 189, 0.3);
}
#chart_days_select:focus {
    outline: none;
    border-color: #4AACBD !important;
    box-shadow: 0 0 0 2px rgba(74, 172, 189, 0.2);
}
</style>
<div id="section-overview" class="dash-panel active">
                        <h3 style="margin-top: 0;">Overview</h3>
                        
                        <!-- Stat Cards -->
                        <div style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
                            <div class="stat-card">
                                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                                    <div class="stat-icon-wrapper">
                                        <i data-lucide="message-circle" style="width: 18px; height: 18px;"></i>
                                    </div>
                                    <div>
                                        <div style="color: #F2F3F5; font-weight: 600; font-size: 14px;">New Messages</div>
                                        <div style="color: #949BA4; font-size: 11px;">in the last 24h</div>
                                    </div>
                                </div>
                                <div id="stat_new_messages" style="color: #F2F3F5; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">-</div>
                            </div>
                            
                            <div class="stat-card">
                                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                                    <div class="stat-icon-wrapper">
                                        <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
                                    </div>
                                    <div>
                                        <div style="color: #F2F3F5; font-weight: 600; font-size: 14px;">Joins/Leaves</div>
                                        <div style="color: #949BA4; font-size: 11px;">in the last 24h</div>
                                    </div>
                                </div>
                                <div id="stat_joins_leaves" style="color: #F2F3F5; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">-</div>
                            </div>

                            <div class="stat-card">
                                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                                    <div class="stat-icon-wrapper">
                                        <i data-lucide="users" style="width: 18px; height: 18px;"></i>
                                    </div>
                                    <div>
                                        <div style="color: #F2F3F5; font-weight: 600; font-size: 14px;">Total Members</div>
                                    </div>
                                </div>
                                <div id="stat_total_members" style="color: #F2F3F5; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">-</div>
                            </div>
                        </div>

                        <!-- Charts Section -->
                        <div style="margin-bottom: 16px;">
                            <label style="display: block; color: #F2F3F5; font-weight: 600; margin-bottom: 8px;">Charts for</label>
                            <select id="chart_days_select" style="width: 100%; max-width: 300px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 12px; border-radius: 4px;">
                                <option value="7">Last 7 Days</option>
                                <option value="14">Last 14 Days</option>
                                <option value="30">Last Month</option>
                                <option value="90">Last 3 Months</option>
                                <option value="180">Last 6 Months</option>
                                <option value="365">Last Year</option>
                            </select>
                        </div>
                        
                        <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;">
                            <div class="chart-card">
                                <div style="color: #F2F3F5; font-weight: 600; font-size: 14px; margin-bottom: 12px;">Joins / Leaves</div>
                                <div style="position: relative; height: 200px; width: 100%;">
                                    <canvas id="chart-joins"></canvas>
                                </div>
                            </div>
                            <div class="chart-card">
                                <div style="color: #F2F3F5; font-weight: 600; font-size: 14px; margin-bottom: 12px;">Member Flow</div>
                                <div style="position: relative; height: 200px; width: 100%;">
                                    <canvas id="chart-flow"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="chart-card">
                            <div style="color: #F2F3F5; font-weight: 600; font-size: 14px; margin-bottom: 12px;">Message Count (excluding Bots)</div>
                            <div style="position: relative; height: 200px; width: 100%;">
                                <canvas id="chart-messages"></canvas>
                            </div>
                        </div>
                    </div>
