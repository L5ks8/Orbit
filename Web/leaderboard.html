<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Server Leaderboard - Orbit</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/base.css?v=3">
    <link rel="stylesheet" href="/static/css/layout.css?v=3">
    <link rel="stylesheet" href="/static/css/components.css?v=3">
    <style>
        .leaderboard-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            background: var(--bg-surface);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
        .server-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-elevated);
        }
        .header-info h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 800;
        }
        .header-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: var(--bg-surface);
            padding: 8px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .cat-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .cat-btn:hover {
            color: var(--text-primary);
            background: var(--bg-elevated);
        }
        .cat-btn.active {
            color: var(--bg-base);
            background: var(--accent-primary);
        }
        .cat-btn.active i {
            color: var(--bg-base);
        }
        
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .lb-row {
            display: flex;
            align-items: center;
            background: var(--bg-surface);
            border-radius: 40px;
            padding: 12px 24px 12px 12px;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid var(--border-color);
        }
        .lb-row:hover {
            transform: translateY(-2px);
            background: var(--bg-elevated);
            border-color: var(--border-hover);
        }
        
        .rank-medal {
            width: 40px;
            font-weight: 800;
            font-size: 18px;
            text-align: center;
        }
        .rank-1 { color: #FFD700; }
        .rank-2 { color: #C0C0C0; }
        .rank-3 { color: #CD7F32; }
        
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-right: 16px;
            background: #5865F2;
        }
        .user-name {
            font-weight: 600;
            font-size: 16px;
            flex: 1;
        }
        
        .stats-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .stat-primary {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-secondary {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .loading-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 18px;
        }
        
        /* Nav */
        .top-nav {
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-surface);
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 20px;
        }
        .nav-logo img {
            width: 32px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/" class="nav-logo">
            <img src="/static/logo.png" alt="Orbit">
            Orbit
        </a>
    </nav>

    <div class="leaderboard-container">
        <div class="header">
            <img id="serverIcon" src="" alt="Server Icon" class="server-icon" style="display:none;">
            <div class="header-info">
                <h1 id="serverName">Loading...</h1>
                <p>Top 100 Leaderboard</p>
            </div>
        </div>

        <div class="controls">
            <button class="cat-btn active" data-sort="total_xp">
                <i data-lucide="star"></i> Level
            </button>
            <button class="cat-btn" data-sort="message_count">
                <i data-lucide="message-square"></i> Messages
            </button>
            <button class="cat-btn" data-sort="voice_minutes">
                <i data-lucide="mic"></i> Voice Hours
            </button>
            <button class="cat-btn" data-sort="reaction_count">
                <i data-lucide="smile"></i> Reactions
            </button>
            <button class="cat-btn" data-sort="invites">
                <i data-lucide="mail"></i> Invites
            </button>
        </div>

        <div id="leaderboardList" class="leaderboard-list">
            <div class="loading-state">
                <i data-lucide="loader" class="spin"></i> Loading Leaderboard...
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        const pathParts = window.location.pathname.split('/');
        const guildId = pathParts[pathParts.length - 1];
        
        let currentSort = 'total_xp';
        
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');
                currentSort = target.dataset.sort;
                fetchLeaderboard();
            });
        });
        
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num;
        }

        async function fetchLeaderboard() {
            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = '<div class="loading-state"><i data-lucide="loader" class="spin"></i> Loading...</div>';
            lucide.createIcons({ root: listEl });
            
            try {
                const res = await fetch(`/api/public_leaderboard/${guildId}?sort=${currentSort}`);
                const data = await res.json();
                
                if (data.error) {
                    listEl.innerHTML = `<div class="loading-state" style="color:var(--danger)">${data.error}</div>`;
                    return;
                }
                
                document.getElementById('serverName').textContent = data.guild_name;
                const icon = document.getElementById('serverIcon');
                if (data.guild_icon) {
                    icon.src = data.guild_icon;
                    icon.style.display = 'block';
                }
                
                listEl.innerHTML = '';
                
                if (data.entries.length === 0) {
                    listEl.innerHTML = '<div class="loading-state">No users found on this leaderboard yet.</div>';
                    return;
                }
                
                data.entries.forEach(entry => {
                    const row = document.createElement('div');
                    row.className = 'lb-row';
                    
                    let rankClass = '';
                    if (entry.rank === 1) rankClass = 'rank-1';
                    else if (entry.rank === 2) rankClass = 'rank-2';
                    else if (entry.rank === 3) rankClass = 'rank-3';
                    
                    let statHTML = '';
                    if (currentSort === 'total_xp') {
                        statHTML = `
                            <div class="stat-primary">Level ${entry.level}</div>
                            <div class="stat-secondary">XP ${formatNumber(entry.total_xp)}</div>
                        `;
                    } else {
                        let iconName = 'star';
                        if (currentSort === 'message_count') iconName = 'message-square';
                        if (currentSort === 'voice_minutes') iconName = 'mic';
                        if (currentSort === 'reaction_count') iconName = 'smile';
                        if (currentSort === 'invites') iconName = 'mail';
                        
                        let valStr = currentSort === 'voice_minutes' ? entry.value.toFixed(1) : formatNumber(entry.value);
                        
                        statHTML = `
                            <div class="stat-primary">${valStr} <i data-lucide="${iconName}" style="width:20px;height:20px;color:var(--text-secondary)"></i></div>
                        `;
                    }
                    
                    row.innerHTML = `
                        <div class="rank-medal ${rankClass}">#${entry.rank}</div>
                        <img src="${entry.avatar || '/static/logo.png'}" class="user-avatar" onerror="this.src='/static/logo.png'">
                        <div class="user-name">${entry.name}</div>
                        <div class="stats-col">
                            ${statHTML}
                        </div>
                    `;
                    listEl.appendChild(row);
                });
                
                lucide.createIcons({ root: listEl });
                
            } catch (err) {
                listEl.innerHTML = '<div class="loading-state" style="color:var(--danger)">Error loading leaderboard.</div>';
            }
        }
        
        fetchLeaderboard();
    </script>
</body>
</html>
